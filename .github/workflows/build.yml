name: Build and Push Docker image
on: 
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
    workflow_dispatch:

# Serialize master publishes, including manually dispatched builds and reruns.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Build:
    runs-on: 
    - ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Build Docker image
      run: |
          docker build . --file oci_build/Dockerfile --tag xiangzhedev/upgradeall-server:latest

    - name: Smoke test HTTP service
      run: bash scripts/smoke-hello.sh xiangzhedev/upgradeall-server:latest

    - name: Login DockerHub
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      uses: docker/login-action@v1
      with:
          username: ${{ secrets.HUB_USR }}
          password: ${{ secrets.HUB_TKN }}

    - name: Push to DockerHub
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      shell: bash
      run: |
          master_head=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
          if [[ "$GITHUB_SHA" != "$master_head" ]]; then
              echo "Skipping publish: master is now $master_head, not $GITHUB_SHA."
              exit 0
          fi
          docker push xiangzhedev/upgradeall-server:latest
